<!doctype html>
<html lang="es" data-theme="light"><head><meta charset="utf-8">
<!-- Fuente de la imagen para compartir. Se captura a 1200×630 → antes-de-la-carrera.png -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..600,0..100&family=IBM+Plex+Mono:wght@500;600&family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="../base.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background-size:32px 32px;padding:0}
  .og{position:relative;width:1200px;height:630px;padding:58px 80px;box-sizing:border-box}
  .og .kicker{font-size:22px;margin-bottom:26px}
  .og .display{font-size:118px;line-height:.92}
  .og .lede{font-size:29px;max-width:26ch;margin-top:26px;color:var(--ink-2)}
  .og .by{position:absolute;left:80px;bottom:48px;font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.04em}
  .stk{position:absolute;display:grid;place-items:center;width:150px;height:150px;border-radius:32px;font-size:84px;box-shadow:0 18px 40px -16px rgba(22,22,24,.35)}
  .hl::before{animation:none!important}
</style></head>
<body>
<div class="og">
  <p class="kicker">5 cosas <b>Episodio 01</b></p>
  <h1 class="display">Antes de la<br><span class="hl">carrera</span></h1>
  <p class="lede">5 cosas que me hubiera gustado aprender, y cómo empezar cada una en 20&nbsp;min.</p>
  <p class="by">@_antonio.selvas</p>
  <span class="stk" style="background:var(--rosa);right:250px;top:70px;rotate:-8deg">🚨</span>
  <span class="stk" style="background:var(--amarillo);right:70px;top:120px;rotate:7deg">🧠</span>
  <span class="stk" style="background:var(--azul);right:290px;top:270px;rotate:5deg">🌐</span>
  <span class="stk" style="background:var(--verde);right:95px;top:320px;rotate:-6deg">🌱</span>
  <span class="stk" style="background:var(--lila);right:230px;top:445px;rotate:-3deg;width:120px;height:120px;font-size:66px">🤖</span>
</div>
</body></html>
