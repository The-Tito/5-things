<!doctype html>
<html lang="es" data-theme="light"><head><meta charset="utf-8">
<!-- Fuente de la imagen para compartir. `npm run og` la captura a 1200×630 → public/assets/og/elige-tus-conectores.png -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..600,0..100&family=IBM+Plex+Mono:wght@500;600&family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="../src/styles/base.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background-size:32px 32px;padding:0}
  .og{position:relative;width:1200px;height:630px;padding:58px 80px;box-sizing:border-box}
  .og .kicker{font-size:22px;margin-bottom:26px}
  .og .display{font-size:112px;line-height:.92}
  .og .lede{font-size:30px;max-width:21ch;margin-top:28px;color:var(--ink-2)}
  .og .by{position:absolute;left:80px;bottom:48px;font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.04em}
  .hl::before{animation:none!important}
  .doc{position:absolute;right:86px;top:92px;width:400px;height:446px;padding:30px 32px;box-sizing:border-box;border-radius:24px;background:var(--card);box-shadow:0 24px 50px -20px rgba(22,22,24,.35),inset 0 0 0 1.5px var(--line);rotate:3deg}
  .doc__name{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.04em;margin-bottom:26px}
  .doc__name::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde-ink)}
  .doc i{display:block;height:13px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);margin-top:16px}
    .doc .row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px}
  .doc .row i{margin:0}
  .sw{position:relative;flex-shrink:0;width:64px;height:36px;border-radius:99px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
  .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(22,22,24,.25)}
  .sw.on{background:var(--verde-ink)}
  .sw.on::after{left:32px}
  .bubble{position:absolute;right:300px;top:420px;max-width:330px;padding:20px 24px;border-radius:24px 24px 24px 6px;background:var(--verde);color:#161618;font-family:var(--f-text);font-weight:600;font-size:25px;line-height:1.25;box-shadow:0 18px 40px -16px rgba(22,22,24,.35);rotate:-3deg}
</style></head>
<body>
<div class="og">
  <p class="kicker">Recursos <b>Prompt</b></p>
  <h1 class="display">Elige tus<br><span class="hl">conectores</span></h1>
  <p class="lede">Qué conectar a tu IA, y con qué permisos.</p>
  <p class="by">@_antonio.selvas</p>
  <div class="doc" aria-hidden="true">
    <span class="doc__name">MCP</span>
    <div class="row"><i style="width:58%"></i><b class="sw on"></b></div>
    <div class="row"><i style="width:72%"></i><b class="sw"></b></div>
    <div class="row"><i style="width:50%"></i><b class="sw on"></b></div>
    <div class="row"><i style="width:66%"></i><b class="sw"></b></div>
    <div class="row"><i style="width:44%"></i><b class="sw"></b></div>
  </div>
  <p class="bubble">¿Qué apps usas?</p>
</div>
</body></html>
